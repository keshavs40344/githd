app = "dharma-os-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  GROQ_MODEL = "llama3-70b-8192"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
